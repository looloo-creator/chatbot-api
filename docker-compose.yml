version: '3.8'

services:
  chatbot-api:
    build: .
    container_name: looloo-chatbot-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8080,http://localhost:18080}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama2
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DATABASE: ${PG_DATABASE:-looloo}
      PG_SSL: "false"
    depends_on:
      - ollama
    networks: [looloo-network]
    command: npm run start:dev

  ollama:
    image: ollama/ollama:latest
    container_name: looloo-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [looloo-network]
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    entrypoint: /bin/sh
    restart: "no"
    command: -c "ollama pull llama2 && ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} && ollama serve"

volumes:
  ollama-data:

networks:
  looloo-network:
    external: true
    name: looloo-network
